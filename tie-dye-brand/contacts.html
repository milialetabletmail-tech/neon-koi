<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты — LN-Team</title>
<meta name="description" content="LN-Team: свяжитесь с нами. Форма связи уже готова, каналы появятся, когда мы откроемся.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header nav-solid" id="site-header">
    <a href="index.html" class="wordmark" aria-label="LN-Team — на главную"><span class="sr-only">LN-Team</span></a>

    <nav class="nav-links" aria-label="Основная навигация">
      <a href="index.html" class="nav-link" data-accent="sage">Главная</a>
      <a href="catalog.html" class="nav-link" data-accent="lavender">Каталог</a>
      <a href="about.html" class="nav-link" data-accent="teal">О бренде</a>
      <a href="contacts.html" class="nav-link" data-accent="sage" aria-current="page">Контакты</a>
    </nav>

    <div class="nav-icons">
      <div class="nav-account">
        <button type="button" class="icon-btn" id="account-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="account-dropdown" aria-label="Аккаунт">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/><circle cx="12" cy="7" r="3.5"/></svg>
        </button>
        <div class="account-dropdown" id="account-dropdown" hidden>
          <a href="account.html" data-accent="teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span>Войти</span></a>
          <a href="account.html" data-accent="sage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>Регистрация</span></a>
        </div>
      </div>

      <a href="cart.html" class="icon-btn" id="cart-link" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </a>

      <button type="button" class="icon-btn burger-btn" id="burger-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="nav-overlay" aria-label="Меню">
        <span class="burger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </header>

  <div class="nav-overlay" id="nav-overlay" hidden>
    <button type="button" class="icon-btn nav-overlay-close" id="nav-overlay-close" aria-label="Закрыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <nav class="nav-overlay-links" aria-label="Полное меню">
      <a href="index.html" class="nav-overlay-link" data-accent="sage">Главная</a>
      <a href="catalog.html" class="nav-overlay-link" data-accent="lavender">Каталог</a>
      <a href="about.html" class="nav-overlay-link" data-accent="teal">О бренде</a>
      <a href="contacts.html" class="nav-overlay-link" data-accent="sage" aria-current="page">Контакты</a>
    </nav>
    <div class="nav-overlay-secondary">
      <a href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Корзина</span></a>
      <a href="account.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/><circle cx="12" cy="7" r="3.5"/></svg><span>Личный кабинет</span></a>
    </div>
  </div>

  <main>
    <section class="contacts-page dye-ambient">
      <div class="contacts-card">
        <p class="contacts-eyebrow">Контакты</p>
        <h1 class="contacts-title">Скоро на связи</h1>
        <p class="contacts-lead">Каналы связи появятся, когда мы откроемся официально. А форма уже готова принимать сообщения.</p>

        <form class="contacts-form">
          <label class="contacts-field"><span>Имя</span><input type="text" name="name" placeholder="Как к вам обращаться"></label>
          <label class="contacts-field"><span>Email</span><input type="email" name="email" placeholder="you@example.com"></label>
          <label class="contacts-field"><span>Сообщение</span><textarea name="message" rows="3" placeholder="Пара слов о том, с чем вы к нам"></textarea></label>
          <button type="submit" class="contacts-submit">Отправить</button>
        </form>

        <ul class="contacts-channels">
          <li>
            <span class="contacts-channel" aria-label="Email — скоро">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>
            </span>
          </li>
          <li>
            <span class="contacts-channel" aria-label="Телефон — скоро">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
          </li>
          <li>
            <span class="contacts-channel" aria-label="Instagram — скоро">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            </span>
          </li>
          <li>
            <span class="contacts-channel" aria-label="Telegram — скоро">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </span>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <script src="js/nav.js"></script>
</body>
</html>
