<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMN — Small-Batch Hand-Dyed Streetwear</title>
<meta name="description" content="SMN: hand-twisted, hand-dyed, one at a time. The Color Burst collection — no two pieces ever the same.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="preloading">

  <!-- ============================================================
       PRELOADER
       ============================================================ -->
  <div id="preloader" aria-hidden="true">
    <div class="preloader-wipe"></div>
    <div class="preloader-mark"></div>
  </div>

  <!-- Header mark: original hand-painted "SMN" artwork with a baked-in
       multicolor paint-splash (see assets/wordmark/README) — shown as a
       plain image, not a recolored mask, since the color already lives in
       the file. The text stays in the DOM for accessibility/SEO but is
       visually hidden; the artwork is what's actually shown. -->
  <div class="wordmark"><span class="sr-only">SMN</span></div>

  <!-- ============================================================
       HERO — "COLOR BURST"
       ============================================================ -->
  <section class="colorburst">
    <div class="colorburst-stage">

      <div class="colorburst-bg"></div>

      <p class="colorburst-label">No two spirals alike</p>

      <!-- SMN is the brand wordmark and the dominant visual on screen,
           centered in the stage; "Tie-Dye" is a small editorial collection
           tag sitting directly beneath it as a detail, not a competing
           headline. -->
      <div class="hero-wordmark-group">
        <h1 class="hero-wordmark"><span class="sr-only">SMN</span></h1>
        <p class="hero-subhead">Tie-Dye</p>
      </div>

      <!-- The dye reveal: a real filmed sequence (white tee -> paint splash ->
           finished spiral tie-dye) scrubbed frame-by-frame against scroll
           position via canvas, rather than a native <video>. Native
           video.currentTime seeking is throttled/keyframe-limited and gets
           janky under fast, repeated scroll-driven seeks — drawing
           pre-decoded frames to canvas is instant and stays perfectly
           locked to scroll. Frame list + preloading + draw logic in main.js. -->
      <div class="garment-stage">
        <canvas class="dye-canvas" width="864" height="496"
          aria-label="A white t-shirt splashed with pink, blue and orange dye, twisted into a spiral tie-dye pattern"></canvas>
      </div>

      <p class="colorburst-batch">Batch 014 — Sunset Spiral</p>

    </div>
  </section>

  <!-- Placeholder — full Manifesto block builds out in the next phase -->
  <section class="next-stub">Manifesto block — Phase 2</section>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
