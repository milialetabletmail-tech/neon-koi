<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LN-team — Small-Batch Hand-Dyed Streetwear</title>
<meta name="description" content="LN-team: hand-twisted, hand-dyed, one at a time. The Color Burst collection — no two pieces ever the same.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="preloading">

  <!-- ============================================================
       PRELOADER
       ============================================================ -->
  <div id="preloader" aria-hidden="true">
    <div class="preloader-wipe"></div>
    <div class="preloader-mark"></div>
  </div>

  <!-- Header mark: hand-painted "LN-team" brush lettering (see
       assets/wordmark/README), shown through the same black-fill mask as
       the Hero wordmark below. The text stays in the DOM for
       accessibility/SEO but is visually hidden; the artwork is what's
       actually shown. -->
  <div class="wordmark"><span class="sr-only">LN-team</span></div>

  <!-- ============================================================
       HERO — "COLOR BURST"
       ============================================================ -->
  <section class="colorburst">
    <div class="colorburst-stage">

      <p class="colorburst-label">No two spirals alike</p>

      <!-- Both marks are solid black now (see css/style.css), which reads
           fine over the lighter/pastel patches of the dyed garment but
           needs help over the studio-gray and darker dye. Rather than a
           drop-shadow halo outlining the letters (visible as a ring), a
           soft-light-blended glow sits behind the whole group and lifts
           the video underneath just enough for black-on-dark to read,
           without the glow itself looking like a shape. -->
      <div class="hero-wordmark-glow" aria-hidden="true"></div>

      <!-- LN-team is the brand wordmark and the dominant visual on screen,
           centered in the stage; "Tie-Dye" is a small editorial collection
           tag sitting directly beneath it as a detail, not a competing
           headline. -->
      <div class="hero-wordmark-group">
        <h1 class="hero-wordmark"><span class="sr-only">LN-team</span></h1>
        <p class="hero-subhead">Tie-Dye</p>
      </div>

      <!-- The dye reveal: the real filmed footage (white tee -> paint splash ->
           finished spiral tie-dye), scrubbed against scroll position by
           driving video.currentTime directly — see buildColorBurst() in
           main.js. Both sources are encoded with a short GOP (keyframe
           every 6 frames) so scroll-driven seeks land on or near a
           keyframe instead of decoding forward from a distant one, which
           is what makes native video seeking feel janky under fast,
           repeated seeks. WebM/VP9 first (smaller, and the only one some
           Chromium builds decode at all), MP4/H.264 as the fallback
           everywhere else (Safari doesn't speak WebM). -->
      <div class="garment-stage">
        <video class="dye-video" muted playsinline preload="auto"
          aria-label="A white t-shirt splashed with lavender, cyan and sage dye, twisted into a spiral tie-dye pattern">
          <source src="assets/video/dye-reveal.webm" type="video/webm">
          <source src="assets/video/dye-reveal.mp4" type="video/mp4">
        </video>
      </div>

      <p class="colorburst-batch">Batch 014 — Закатная спираль</p>

      <!-- Interaction hint: fades in shortly after load, fades out for
           good on the first scroll or tap (see hideScrollHint in main.js).
           pointer-events: none so it never steals the tap it's advertising —
           the click listener lives on .colorburst-stage itself. -->
      <div class="scroll-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        <span>Scroll or tap</span>
      </div>

    </div>
  </section>

  <!-- Placeholder — full Manifesto block builds out in the next phase -->
  <section class="next-stub">Manifesto block — Phase 2</section>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
