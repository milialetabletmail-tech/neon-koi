<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Spiral — Tie-Dye Streetwear</title>
<meta name="description" content="Custom tie-dye streetwear. Every piece is one moment, one batch, one burst of color.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="preloading">

  <!-- ============================================================
       PRELOADER
       ============================================================ -->
  <div id="preloader">
    <div class="preloader-wipe"></div>
    <p class="preloader-mark">SUNSET&nbsp;SPIRAL</p>
  </div>

  <div class="wordmark">Sunset&nbsp;Spiral</div>

  <!-- ============================================================
       HERO — "COLOR BURST"
       ============================================================ -->
  <section class="colorburst">
    <div class="colorburst-stage">

      <div class="colorburst-bg"></div>

      <div class="burst-blob burst-blob--pink"   data-blob="pink"></div>
      <div class="burst-blob burst-blob--blue"   data-blob="blue"></div>
      <div class="burst-blob burst-blob--orange" data-blob="orange"></div>

      <p class="colorburst-label">Every piece is one moment</p>

      <h1 class="colorburst-headline" data-split>
        <span class="line">Color</span>
        <span class="line">Burst</span>
      </h1>

      <div class="garment-stage">
        <div class="garment-photo">
          <img src="assets/garment/tee-front-undyed.svg" alt="Undyed cotton tee, front view">
        </div>
        <div class="garment-dye"></div>
      </div>

      <p class="colorburst-batch">Batch 014 — Sunset Spiral</p>

    </div>
  </section>

  <!-- Placeholder — full Manifesto block builds out in the next phase -->
  <section class="next-stub">Manifesto block — Phase 2</section>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
